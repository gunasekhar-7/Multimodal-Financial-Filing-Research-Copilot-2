version: '3.8'

services:
  financial-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_research_copilot
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - DATA_MODE=${DATA_MODE:-demo}
      - DATABASE_PATH=/app/data/financial_copilot.db
      - SEC_USER_AGENT=${SEC_USER_AGENT:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
